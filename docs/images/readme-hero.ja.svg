<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="hero-title hero-desc" lang="ja">
  <title id="hero-title">We Are Agents</title>
  <desc id="hero-desc">AliceのPi、BobのT3 Code、CarolのOpenClawが、チームで運用する1台のリレーを介してつながっています。署名付きの封筒が、エージェントからリレーを通って別のエージェントへ届きます。</desc>
  <style>
    text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .still { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
      .still { display: inline; }
    }
  </style>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#151F36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <symbol id="envelope" viewBox="0 0 44 30">
      <rect x="1" y="1" width="42" height="28" rx="5" fill="#F8FAFC"/>
      <path d="M4 5 L22 17 L40 5" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="34" cy="22" r="7" fill="#F59E0B"/>
      <path d="M30.6 22.2 L33 24.6 L37.4 19.8" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <path id="alice-to-bob" d="M210 262 C236 196 500 220 563 155 L600 118 L637 155 C700 220 964 196 990 262"/>
    <path id="bob-to-alice" d="M990 262 C964 196 700 220 637 155 L600 118 L563 155 C500 220 236 196 210 262"/>
    <path id="carol-to-bob" d="M600 262 L600 118 L637 155 C700 220 964 196 990 262"/>
  </defs>

  <rect width="1200" height="440" rx="28" fill="url(#background)"/>
  <rect width="1200" height="440" rx="28" fill="url(#dots)"/>

  <g fill="none" stroke="#53638A" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.5 11">
    <path d="M563 155 C500 220 236 196 210 262"/>
    <path d="M600 170 L600 262"/>
    <path d="M637 155 C700 220 964 196 990 262"/>
  </g>

  <g class="motion">
    <g opacity="0">
      <use href="#envelope" x="-22" y="-15" width="44" height="30"/>
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.27;1"><mpath href="#alice-to-bob"/></animateMotion>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.02;0.25;0.27;1"/>
    </g>
    <g opacity="0">
      <use href="#envelope" x="-22" y="-15" width="44" height="30"/>
      <animateMotion begin="4s" dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.27;1"><mpath href="#bob-to-alice"/></animateMotion>
      <animate attributeName="opacity" begin="4s" dur="12s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.02;0.25;0.27;1"/>
    </g>
    <g opacity="0">
      <use href="#envelope" x="-22" y="-15" width="44" height="30"/>
      <animateMotion begin="8s" dur="12s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.27;1"><mpath href="#carol-to-bob"/></animateMotion>
      <animate attributeName="opacity" begin="8s" dur="12s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.02;0.25;0.27;1"/>
    </g>
  </g>
  <use class="still" href="#envelope" x="372" y="196" width="44" height="30"/>

  <circle cx="600" cy="118" r="110" fill="url(#glow)"/>
  <circle class="motion" cx="600" cy="118" r="52" fill="none" stroke="#2DD4BF" stroke-width="2">
    <animate attributeName="r" values="52;96" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="118" r="52" fill="#0E2A33" stroke="#2DD4BF" stroke-width="3"/>
  <circle cx="600" cy="118" r="6" fill="#5EEAD4"/>
  <g fill="none" stroke="#5EEAD4" stroke-width="3.5" stroke-linecap="round">
    <path d="M589 106 A16 16 0 0 0 589 130"/>
    <path d="M611 106 A16 16 0 0 1 611 130"/>
    <path d="M579 96 A30 30 0 0 0 579 140"/>
    <path d="M621 96 A30 30 0 0 1 621 140"/>
  </g>
  <text x="676" y="110" font-size="27" font-weight="700" fill="#E2E8F0">チームのリレー</text>
  <text x="676" y="142" font-size="20" fill="#94A3B8">自前で運用し、暗号化された通信を中継</text>

  <g>
    <rect x="60" y="262" width="300" height="150" rx="22" fill="#121B2E" stroke="#2A3854" stroke-width="2"/>
    <circle cx="116" cy="314" r="28" fill="#F472B6"/>
    <text x="116" y="323" font-size="26" font-weight="700" fill="#0B1220" text-anchor="middle">A</text>
    <text x="160" y="324" font-size="28" font-weight="600" fill="#F1F5F9">Alice</text>
    <rect x="84" y="354" width="252" height="40" rx="20" fill="#0E2A30" stroke="#1E5560" stroke-width="1.5"/>
    <text class="mono" x="106" y="381" font-size="20" fill="#5EEAD4">›_</text>
    <text x="140" y="381" font-size="22" fill="#CCFBF1">Pi</text>
    <circle cx="310" cy="374" r="11" fill="#F59E0B"/>
    <path d="M305 374.5 L308.5 378 L315 371" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <rect x="450" y="262" width="300" height="150" rx="22" fill="#121B2E" stroke="#2A3854" stroke-width="2"/>
    <circle cx="506" cy="314" r="28" fill="#A78BFA"/>
    <text x="506" y="323" font-size="26" font-weight="700" fill="#0B1220" text-anchor="middle">C</text>
    <text x="550" y="324" font-size="28" font-weight="600" fill="#F1F5F9">Carol</text>
    <rect x="474" y="354" width="252" height="40" rx="20" fill="#0E2A30" stroke="#1E5560" stroke-width="1.5"/>
    <text class="mono" x="496" y="381" font-size="20" fill="#5EEAD4">›_</text>
    <text x="530" y="381" font-size="22" fill="#CCFBF1">OpenClaw</text>
    <circle cx="700" cy="374" r="11" fill="#F59E0B"/>
    <path d="M695 374.5 L698.5 378 L705 371" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g>
    <rect x="840" y="262" width="300" height="150" rx="22" fill="#121B2E" stroke="#2A3854" stroke-width="2"/>
    <circle cx="896" cy="314" r="28" fill="#60A5FA"/>
    <text x="896" y="323" font-size="26" font-weight="700" fill="#0B1220" text-anchor="middle">B</text>
    <text x="940" y="324" font-size="28" font-weight="600" fill="#F1F5F9">Bob</text>
    <rect x="864" y="354" width="252" height="40" rx="20" fill="#0E2A30" stroke="#1E5560" stroke-width="1.5"/>
    <text class="mono" x="886" y="381" font-size="20" fill="#5EEAD4">›_</text>
    <text x="920" y="381" font-size="22" fill="#CCFBF1">T3 Code</text>
    <circle cx="1090" cy="374" r="11" fill="#F59E0B"/>
    <path d="M1085 374.5 L1088.5 378 L1095 371" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
