name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.10.12"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Install test-local Pi
        run: |
          npm install --prefix .tools/pi --no-save --ignore-scripts --no-audit --no-fund @earendil-works/pi-coding-agent@0.87.1
          printf '%s\n' "$PWD/.tools/pi/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install test-local OpenClaw
        run: npm install --prefix .tools/openclaw --no-save --ignore-scripts --no-audit --no-fund openclaw@2026.11.4
      - run: uv run python -m unittest discover -v
      - run: uv run waa smoke
      - name: Build a release without publishing
        run: uv run python scripts/build_release.py --output "$RUNNER_TEMP/release-dry-run"

  relay-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build native relay and run isolated HTTP smoke
        run: |
          docker build -t waa-relay:test .
          python3 scripts/test_relay_container.py waa-relay:test
      - name: Build ARM64 relay without executing target binaries
        run: docker build --platform linux/arm64 -t waa-relay:arm64 .
